<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090A0F" />
    <title>MESSIAH Mobile</title>
  </head>
  <body style="margin:0;background:#090A0F;color:#F0F4FC;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
    <div style="max-width:420px;background:#12151E;border:1px solid #1E2536;border-radius:16px;padding:24px;">
      <h1 style="font-size:18px;margin:0 0 8px;">MESSIAH Mobile Wrapper</h1>
      <p style="font-size:13px;color:#94A3B8;line-height:1.5;">
        Configure <code>MESSIAH_MOBILE_WEB_URL</code> to point at your HTTPS MESSIAH deployment and run <code>pnpm --filter @messiah/mobile exec cap sync</code>.
      </p>
    </div>
  </body>
</html>
