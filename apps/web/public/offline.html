<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090A0F" />
    <title>MESSIAH — Offline Mode</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090A0F;
        color: #F0F4FC;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 440px;
        background: #12151E;
        border: 1px solid #1E2536;
        border-radius: 16px;
        padding: 28px;
      }
      .badge {
        display: inline-block;
        font-family: monospace;
        font-size: 11px;
        color: #FFB800;
        background: rgba(255, 184, 0, 0.12);
        border: 1px solid rgba(255, 184, 0, 0.3);
        border-radius: 6px;
        padding: 3px 8px;
        margin-bottom: 12px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 13px; color: #94A3B8; line-height: 1.5; margin: 0 0 18px; }
      button {
        background: #00F0FF;
        color: #090A0F;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">OFFLINE</div>
      <h1>Network Connection Unavailable</h1>
      <p>
        MESSIAH cannot reach your backend gateway right now. Server-side agent execution, Local Agent Bridge commands, and approvals remain paused until connectivity returns.
      </p>
      <p>No sensitive credentials or private memories are cached offline for your security.</p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </main>
  </body>
</html>
